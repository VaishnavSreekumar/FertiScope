[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fertiscope"
version = "0.1.0"
description = "Reproducible Research Data Science & Machine Learning Platform for Reproductive Health & IVF Analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FertiScope Research Contributors"}
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "duckdb>=1.0.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.5.0",
    "tabulate>=0.9.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0.0",
    "shap>=0.44.0",
]
presentation = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

